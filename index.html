<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인물 사진 변환</title>
<style>
  :root { color-scheme: light; font: 16px/1.55 "Malgun Gothic", system-ui, sans-serif; color: #202a25; background: #f3f5f0; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; }
  header, main { max-width: 1160px; margin: auto; padding: 24px; }
  header { padding-top: 42px; }
  h1 { margin: 3px 0 8px; font-size: clamp(2rem, 5vw, 3.4rem); letter-spacing: -.055em; line-height: 1.2; }
  h2 { margin: 0 0 12px; font-size: 1.14rem; }
  p { margin: 0 0 10px; }
  header p:last-child, .muted { color: #505e54; }
  .eyebrow { font-size: .85rem; font-weight: bold; color: #286747; }
  main { padding-top: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 18px; align-items: start; }
  section { min-width: 0; padding: 20px; background: white; border: 1px solid #dbe2d9; border-radius: 16px; }
  .results { grid-column: 1 / -1; }
  button, select, .button { font: inherit; min-height: 44px; border: 1px solid #b9c8bc; border-radius: 8px; padding: 8px 12px; background: #fff; color: inherit; }
  button, .button { cursor: pointer; }
  button:disabled { opacity: .52; cursor: default; }
  :focus-visible { outline: 3px solid #357b56; outline-offset: 2px; }
  .primary { background: #245a40; color: white; border-color: #245a40; }
  .button { display: inline-flex; align-items: center; text-decoration: none; }
  .drop-zone { width: 100%; min-height: 106px; border: 2px dashed #9db3a3; background: #f7faf6; }
  .drop-zone strong, .drop-zone span { display: block; pointer-events: none; }
  .drop-zone span { font-size: .85rem; margin-top: 4px; }
  .drop-zone.dragging { background: #dcf0e2; border-color: #245a40; }
  fieldset { margin: 0 0 12px; padding: 0; border: 0; min-width: 0; }
  legend { padding: 0; margin-bottom: 7px; font-weight: bold; }
  .choices { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
  .choice { padding: 4px; display: grid; justify-items: center; align-content: center; gap: 4px; min-width: 0; font-size: .8rem; line-height: 1.3; overflow-wrap: anywhere; }
  .choice[aria-pressed="true"] { border-color: #245a40; background: #e5f2e9; box-shadow: inset 0 0 0 1px #245a40; }
  .choice-icon { display: grid; place-items: center; width: 100%; max-width: 94px; aspect-ratio: 8 / 5; overflow: hidden; border-radius: 6px; background: #eef3ed; }
  .choice-icon canvas { display: block; width: 100%; height: 100%; }
  .choice-icon svg { width: 64%; height: 80%; }
  .comparison { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 12px 0 16px; }
  figure { margin: 0; min-width: 0; }
  figcaption { margin-bottom: 4px; font-weight: bold; }
  .frame { display: grid; place-items: center; background: #eef1ec; border-radius: 8px; height: clamp(155px, 32vw, 330px); overflow: hidden; text-align: center; padding: 6px; }
  .frame img { width: 100%; height: 100%; min-height: 0; object-fit: contain; }
  ul { list-style: none; margin: 12px 0 0; padding: 0; }
  li { display: flex; gap: 8px; align-items: center; margin-top: 8px; min-width: 0; }
  .photo { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; text-align: left; }
  .photo[aria-pressed="true"] { background: #e5f2e9; border-color: #357b56; }
  .photo img { width: 36px; height: 36px; object-fit: cover; border-radius: 4px; }
  .filename { overflow-wrap: anywhere; min-width: 0; }
  .errors { color: #96322a; overflow-wrap: anywhere; }
  .result-name { margin: 0 0 6px; }
  #downloads { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 235px), 1fr)); gap: 10px; }
  #downloads li { display: block; padding: 10px; border: 1px solid #dbe2d9; border-radius: 8px; }
  #downloads .frame { height: 110px; }
  #downloads .comparison { margin: 0 0 10px; }
  #downloads figcaption { font-size: .8rem; }
  #status { margin-top: 10px; }
  progress { width: 100%; height: 14px; accent-color: #245a40; }
  @media (max-width: 700px) {
    header, main { padding-inline: 12px; }
    header { padding-top: 24px; }
    main { grid-template-columns: minmax(0, 1fr); gap: 12px; }
    section { padding: 14px; }
  }
</style>
</head>
<body>
<header>
  <p class="eyebrow">사진 작업실</p>
  <h1>인물 사진 변환</h1>
  <p>여러 사진에 같은 스타일을 적용하세요. 사진은 이 기기에서만 처리됩니다.</p>
</header>
<main>
  <section aria-labelledby="upload-title">
    <h2 id="upload-title">1. 사진 선택</h2>
    <p class="muted">JPG, PNG, WebP · 최대 20장 · 장당 20MB</p>
    <input id="files" type="file" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" multiple hidden>
    <button id="choose" class="drop-zone" type="button">
      <strong>사진 선택</strong><span>누르거나 사진을 여기로 끌어다 놓으세요</span>
    </button>
    <p id="count" class="muted" role="status">0장 선택</p>
    <ul id="photos" aria-label="선택한 사진"></ul>
    <ul id="import-errors" class="errors" aria-live="polite"></ul>
  </section>
  <section aria-labelledby="edit-title">
    <h2 id="edit-title">2. 스타일 선택</h2>
    <fieldset><legend>인물 스타일</legend><div id="styles" class="choices"></div></fieldset>
    <fieldset><legend>풍경 프레임</legend><div id="backgrounds" class="choices"></div></fieldset>
    <p class="muted">인물 효과와 풍경 프레임을 조합할 수 있습니다. 같은 그림을 다시 누르면 선택이 해제됩니다.</p>
    <div class="comparison">
      <figure><figcaption>원본</figcaption><div class="frame"><span id="original-empty">사진을 추가해 주세요</span><img id="original" alt="대표 사진 원본" hidden></div></figure>
      <figure><figcaption>변환 미리보기</figcaption><div class="frame"><span id="preview-empty">사진을 추가해 주세요</span><img id="preview" alt="대표 사진 변환 결과" hidden></div></figure>
    </div>
    <button id="convert" class="primary" type="button" disabled>전체 사진 변환</button>
    <div id="progress-box" hidden>
      <p id="status" role="status"></p>
      <progress id="progress" max="100" value="0" aria-label="전체 사진 변환 진행률"></progress>
    </div>
    <ul id="conversion-errors" class="errors" aria-live="polite"></ul>
  </section>
  <section id="results" class="results" aria-labelledby="save-title" hidden>
    <h2 id="save-title">3. 결과 저장</h2>
    <a id="zip" class="button primary" download="인물 사진 변환.zip">전체 ZIP 저장</a>
    <ul id="downloads"></ul>
  </section>
</main>
<script>
  'use strict';

  const styles = [
    { name: '만화', icon: 'M4 5h16v11h-8l-5 4v-4H4z M8 10h.1m4 0h.1m4 0h.1', tone: { saturation: 1.26, contrast: 1.14, steps: 7, outline: 1.35 } },
    { name: '3D 피규어풍', icon: 'm12 3 8 4v10l-8 4-8-4V7z m-8 4 8 4 8-4m-8 4v10', tone: { saturation: 1.16, contrast: 1.18, smooth: .42, gloss: 29 } },
    { name: '수채화', icon: 'M12 3c3 4 6 7 6 11a6 6 0 0 1-12 0c0-4 3-7 6-11z m-3 11c0 2 1 3 3 3', tone: { saturation: .86, contrast: .85, smooth: .76, paper: 15 } },
    { name: '연필 스케치', icon: 'm5 15 11-11 4 4L9 19l-5 1z m8-8 4 4 M4 22h16', tone: { saturation: 0, paper: 54, outline: 2.55 } },
    { name: '잉크 드로잉', icon: 'm4 20 4-12 8-4 4 4-4 8z m0 0 8-8 m-1 0a1 1 0 1 0 2 0 1 1 0 0 0-2 0', tone: { saturation: 0, contrast: 1.72, steps: 3, outline: 2.4 } },
    { name: '유화풍', icon: 'M4 4h16v16H4z m0 13 6-7 4 5 2-3 4 5 M16 8h.1', tone: { saturation: 1.24, contrast: 1.14, smooth: .65, steps: 10, warmth: 12 } },
    { name: '파스텔', icon: 'M12 12c-9 2-9-8-2-6 0-6 9-4 7 2 6 0 5 9-1 8-1 6-10 4-8-2z m3-1h.1', tone: { saturation: .71, contrast: .83, smooth: .5, paper: 25, warmth: 8 } },
    { name: '팝아트', icon: 'm12 3 2 5 5-2-2 5 4 3-5 1 1 5-5-3-4 3v-5l-5-2 4-3-1-5 5 3z', tone: { saturation: 1.72, contrast: 1.43, steps: 4, outline: 1.15 } },
    { name: '레트로 만화', icon: 'M4 5h16v14H4z M4 9h16 M8 13h.1m4 0h.1m4 0h.1m-8 3h.1m4 0h.1m4 0h.1', tone: { saturation: .76, contrast: 1.22, warmth: 28, steps: 6, outline: 1.08 } },
    { name: '픽셀 아트', icon: 'M4 4h5v5H4z m11 0h5v5h-5z M9 9h6v6H9z m-5 6h5v5H4z m11 0h5v5h-5z', pixel: true, tone: { saturation: 1.18, contrast: 1.1, steps: 8 } }
  ];
  const backgrounds = [
    { name: '바다', sky: ['#589fc4', '#b8edeb'], layers: [
      ['#fff4c9', 'M30 27a11 11 0 1 0 22 0a11 11 0 1 0-22 0'],
      ['#287c9d', 'M0 49Q40 43 82 49T160 48V100H0Z'],
      ['#47b2b2', 'M0 68Q20 57 50 64T112 61T160 63V100H0Z'],
      ['#d7f4df', 'M0 78Q20 62 55 76T115 76T160 69V100H0Z'],
      ['#efd2a7', 'M0 86Q24 71 56 83T117 82T160 76V100H0Z']
    ] },
    { name: '산', sky: ['#7695c6', '#f4dbc4'], layers: [
      ['#546d98', 'M0 63L36 26 57 50 94 13 160 71V100H0Z'],
      ['#f3eee8', 'M26 37L36 26 48 39 39 36 34 41Z M78 29L94 13 119 35 100 29 91 34 87 27Z'],
      ['#3c526b', 'M0 78L29 55 67 79 126 55 160 72V100H0Z'],
      ['#273f53', 'M0 87Q38 70 77 92Q113 77 160 85V100H0Z']
    ] },
    { name: '계곡', sky: ['#90c6c3', '#ecedd4'], layers: [
      ['#769b7e', 'M0 39L27 22 72 66 111 37 160 30V100H0Z'],
      ['#426e57', 'M0 39Q30 38 67 74Q102 58 160 43V100H0Z'],
      ['#b8e2d7', 'M88 53Q55 66 79 74Q99 80 49 100H105Q132 80 99 72Q73 66 92 53Z'],
      ['#69b2a9', 'M93 57Q65 67 88 74Q112 82 62 100H86Q123 82 94 73Q70 68 93 57Z']
    ] },
    { name: '우주', sky: ['#101638', '#4d3673'], layers: [
      ['#715ea1', 'M0 78Q68 62 160 25V48Q70 78 0 87Z'],
      ['#fff3c8', 'M15 17h2v2h-2z M44 33h2v2h-2z M58 12h2v2h-2z M81 24h2v2h-2z M146 14h2v2h-2z M137 72h2v2h-2z M116 88h2v2h-2z M29 82h2v2h-2z M14 54h2v2h-2z M45 64l2 4 4 2-4 1-2 5-1-5-5-1 5-2z'],
      ['#dbaac0', 'M95 41a20 20 0 1 0 40 0a20 20 0 1 0-40 0'],
      ['#f6dcba', 'M85 56Q103 43 148 35Q161 36 137 48Q105 61 85 56ZM94 54Q115 53 145 39Q121 43 94 54Z']
    ] },
    { name: '하늘', sky: ['#528bc6', '#c9e6f5'], layers: [
      ['#e1f1f8', 'M0 60Q3 46 18 50Q22 31 39 41Q51 38 56 55Q66 54 70 63H0Z M84 42Q91 34 102 38Q111 21 127 29Q145 21 151 39L160 43V49H82Z'],
      ['#fffdf6', 'M0 81Q16 65 33 73Q50 54 68 72Q84 68 98 82Q115 63 130 70Q145 59 160 67V100H0Z'],
      ['#edf6f8', 'M0 90Q31 79 66 89T130 89T160 84V100H0Z']
    ] },
    { name: '숲', sky: ['#7fac97', '#d5e1ac'], layers: [
      ['#658d73', 'M0 70L14 31 26 61 42 23 63 69 77 36 99 69 124 19 144 62 154 32 160 51V100H0Z'],
      ['#326250', 'M0 63L16 52 29 23 46 69 58 54 73 81 107 74 128 39 143 64 154 47 160 65V100H0Z'],
      ['#244939', 'M0 83Q35 67 69 88Q107 82 132 79L160 86V100H0Z'],
      ['#d9ca9c', 'M81 79Q91 88 76 100H117Q93 89 84 79Z']
    ] },
    { name: '사막', sky: ['#dfa36f', '#ffe4af'], layers: [
      ['#ffedb9', 'M104 29a15 15 0 1 0 30 0a15 15 0 1 0-30 0'],
      ['#d88762', 'M0 71Q46 43 73 51T160 50V100H0Z'],
      ['#e8b478', 'M0 66Q41 73 80 62T160 64V100H0Z'],
      ['#be7354', 'M0 94Q28 73 68 82T160 74V100H0Z']
    ] },
    { name: '도시 야경', sky: ['#222b54', '#a36c91'], layers: [
      ['#e9d2b2', 'M121 22a9 9 0 1 0 18 0a9 9 0 1 0-18 0'],
      ['#343957', 'M0 100V57H17V42H36V67H49V50H65V65H80V31H84V23H87V31H96V69H109V54H127V63H137V45H151V66H160V100Z'],
      ['#eacb8b', 'M21 48h4v4h-4z M29 48h4v4h-4z M21 57h4v4h-4z M53 56h4v4h-4z M84 41h4v4h-4z M84 51h4v4h-4z M114 60h4v4h-4z M142 52h4v4h-4z M142 61h4v4h-4z'],
      ['#242c47', 'M0 82Q40 77 80 84T160 80V100H0Z']
    ] },
    { name: '설원', sky: ['#789dc0', '#e6eff3'], layers: [
      ['#9cb2cd', 'M0 61L28 41 54 57 92 28 125 55 160 42V100H0Z'],
      ['#f7faf7', 'M0 69Q32 56 66 71T124 66T160 65V100H0Z'],
      ['#d5e5ea', 'M0 85Q34 91 65 82T122 86T160 78V100H0Z'],
      ['#54747e', 'M16 87h4v-8h10L18 54 7 79h9z M141 88h4v-6h10l-12-25-11 25h9z']
    ] },
    { name: '노을', sky: ['#755986', '#f5ab83'], layers: [
      ['#ffd8a3', 'M93 48a17 17 0 1 0 34 0a17 17 0 1 0-34 0'],
      ['#8f718a', 'M0 69L29 48 64 67 91 55 113 66 144 54 160 68V100H0Z'],
      ['#5c526e', 'M0 81Q43 64 79 81Q115 70 160 77V100H0Z'],
      ['#403c55', 'M0 90Q32 83 71 93T160 87V100H0Z']
    ] }
  ];

  const ui = Object.fromEntries(Array.from(document.querySelectorAll('[id]'), node => [node.id, node]));
  const photos = [];
  const downloadUrls = [];
  const maxFiles = 20;
  const maxBytes = 20 * 1024 * 1024;
  let selected = null;
  let selectedStyle = null;
  let selectedBackground = null;
  let busy = false;

  function showChoices(container, items, onSelect) {
    for (const item of items) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'choice';
      button.setAttribute('aria-pressed', 'false');
      const icon = document.createElement('span');
      icon.className = 'choice-icon';
      icon.setAttribute('aria-hidden', 'true');
      if (item.layers) {
        const thumbnail = document.createElement('canvas');
        thumbnail.width = 160;
        thumbnail.height = 100;
        paintLandscape(thumbnail.getContext('2d'), 160, 100, item);
        icon.append(thumbnail);
      } else {
        const namespace = 'http://www.w3.org/2000/svg';
        const drawing = document.createElementNS(namespace, 'svg');
        drawing.setAttribute('viewBox', '0 0 24 24');
        drawing.setAttribute('fill', 'none');
        drawing.setAttribute('stroke', '#286747');
        drawing.setAttribute('stroke-width', '1.5');
        drawing.setAttribute('stroke-linecap', 'round');
        drawing.setAttribute('stroke-linejoin', 'round');
        const line = document.createElementNS(namespace, 'path');
        line.setAttribute('d', item.icon);
        drawing.append(line);
        icon.append(drawing);
      }
      button.append(icon, item.name);
      button.addEventListener('click', () => {
        const activate = button.getAttribute('aria-pressed') === 'false';
        for (const choice of container.children) {
          choice.setAttribute('aria-pressed', String(activate && choice === button));
        }
        onSelect(activate ? item : null);
        clearResults();
        showPreview();
      });
      container.append(button);
    }
  }

  showChoices(ui.styles, styles, style => { selectedStyle = style; });
  showChoices(ui.backgrounds, backgrounds, background => { selectedBackground = background; });

  function decode(file) {
    return createImageBitmap(file, { imageOrientation: 'from-image' });
  }

  function paintLandscape(context, width, height, background) {
    context.save();
    context.scale(width / 160, height / 100);
    const sky = context.createLinearGradient(0, 0, 0, 100);
    sky.addColorStop(0, background.sky[0]);
    sky.addColorStop(1, background.sky[1]);
    context.fillStyle = sky;
    context.fillRect(0, 0, 160, 100);
    for (const [color, shape] of background.layers) {
      context.fillStyle = color;
      context.fill(new Path2D(shape), 'evenodd');
    }
    context.restore();
  }

  function makeCanvas(image, style, background, maxEdge = Infinity) {
    const scale = Math.min(1, maxEdge / Math.max(image.width, image.height));
    const width = Math.max(1, Math.round(image.width * scale));
    const height = Math.max(1, Math.round(image.height * scale));
    const canvas = document.createElement('canvas');
    const left = background ? Math.max(1, Math.round(width * .24)) : 0;
    const top = background ? Math.max(1, Math.round(height * .20)) : 0;
    canvas.width = width + left * 2;
    canvas.height = height + top * 2;
    const context = canvas.getContext('2d', { alpha: false });
    context.fillStyle = '#ffffff';
    if (background) {
      paintLandscape(context, canvas.width, canvas.height, background);
      const trim = Math.max(1, Math.round(Math.min(width, height) * .012));
      context.fillStyle = '#0003';
      context.fillRect(left - trim, top, width + trim * 3, height + trim * 3);
      context.fillStyle = '#fffcf3';
      context.fillRect(left - trim, top - trim, width + trim * 2, height + trim * 2);
    }
    context.fillStyle = '#ffffff';
    context.fillRect(left, top, width, height);
    if (style?.pixel) {
      const sample = makeCanvas(image, null, null, 70);
      context.imageSmoothingEnabled = false;
      context.drawImage(sample, left, top, width, height);
    } else {
      context.drawImage(image, left, top, width, height);
    }
    if (style?.tone) applyTone(context, left, top, width, height, style.tone);
    return canvas;
  }

  function applyTone(context, left, top, width, height, {
    contrast = 1, saturation = 1, warmth = 0, steps = 256, outline = 0, smooth = 0, paper = 0, gloss = 0
  }) {
    const pixels = context.getImageData(left, top, width, height);
    const data = pixels.data;
    const stride = width * 4;
    const sample = Math.max(1, Math.round(Math.max(width, height) / 320));
    const step = 255 / (steps - 1);
    for (let y = 0; y < height; y++) {
      const lowerRow = Math.min(y + sample, height - 1) * stride;
      for (let x = 0; x < width; x++) {
        const index = y * stride + x * 4;
        const right = y * stride + Math.min(x + sample, width - 1) * 4;
        const down = lowerRow + x * 4;
        const lightness = data[index] * .213 + data[index + 1] * .715 + data[index + 2] * .072;
        const edge = Math.max(Math.abs(data[index + 1] - data[right + 1]),
          Math.abs(data[index + 1] - data[down + 1]));
        const ink = Math.max(0, edge - 8) * outline;
        const tint = warmth * (1 - Math.abs(lightness - 128) / 128);
        const highlight = gloss * Math.pow(lightness / 255, 3);
        const texture = paper * (.6 + ((x * 17 + y * 31 + x * y * 3) % 13) / 32);
        for (let channel = 0; channel < 3; channel++) {
          const color = data[index + channel];
          const nearby = (data[right + channel] + data[down + channel]) / 2;
          const blended = color + (nearby - color) * smooth;
          const adjusted = (lightness + (blended - lightness) * saturation - 128) * contrast + 128;
          const shade = Math.round(adjusted / step) * step;
          data[index + channel] = shade + tint * (1 - channel) + highlight + texture - ink;
        }
      }
    }
    context.putImageData(pixels, left, top);
  }

  function encode(canvas) {
    return new Promise((resolve, reject) => {
      canvas.toBlob(blob => {
        canvas.width = 0;
        if (blob) resolve(blob);
        else reject(new Error('사진을 JPG로 저장할 수 없습니다.'));
      }, 'image/jpeg', .92);
    });
  }

  function report(list, filename, reason) {
    const item = document.createElement('li');
    item.textContent = filename + ' · ' + reason;
    list.append(item);
  }

  function updateControls() {
    ui.choose.disabled = busy;
    ui.convert.disabled = busy || photos.length === 0;
    for (const button of document.querySelectorAll('#photos button, .choice')) button.disabled = busy;
  }

  function clearResults() {
    for (const url of downloadUrls.splice(0)) URL.revokeObjectURL(url);
    ui.results.hidden = true;
    ui.zip.removeAttribute('href');
    ui.downloads.replaceChildren();
    ui['conversion-errors'].replaceChildren();
    ui['progress-box'].hidden = true;
    ui.status.textContent = '';
  }

  function showPreview() {
    ui.original.hidden = ui.preview.hidden = !selected;
    ui['original-empty'].hidden = ui['preview-empty'].hidden = Boolean(selected);
    if (selected) {
      ui.original.src = selected.preview;
      ui.preview.src = makeCanvas(selected.bitmap, selectedStyle, selectedBackground).toDataURL('image/jpeg', .92);
    } else {
      ui.original.removeAttribute('src');
      ui.preview.removeAttribute('src');
    }
  }

  function showPhotos() {
    ui.count.textContent = photos.length + '장 선택';
    ui.photos.replaceChildren();
    for (const photo of photos) {
      const item = document.createElement('li');
      const pick = document.createElement('button');
      pick.className = 'photo';
      pick.setAttribute('aria-pressed', String(photo === selected));
      const thumbnail = new Image();
      thumbnail.alt = '';
      thumbnail.src = photo.preview;
      const name = document.createElement('span');
      name.className = 'filename';
      name.textContent = photo.file.name;
      pick.append(thumbnail, name);
      pick.addEventListener('click', () => {
        selected = photo;
        for (const button of ui.photos.querySelectorAll('.photo')) {
          button.setAttribute('aria-pressed', String(button === pick));
        }
        showPreview();
      });
      const remove = document.createElement('button');
      remove.textContent = '제외';
      remove.setAttribute('aria-label', photo.file.name + ' 제외');
      remove.addEventListener('click', () => {
        const index = photos.indexOf(photo);
        photos.splice(index, 1);
        photo.bitmap.close();
        if (photo === selected) selected = photos[Math.min(index, photos.length - 1)] || null;
        clearResults();
        showPhotos();
        showPreview();
        (ui.photos.children[index]?.querySelector('.photo') || ui.choose).focus();
      });
      item.append(pick, remove);
      ui.photos.append(item);
    }
    updateControls();
  }

  async function supportedFormat(file) {
    const header = new Uint8Array(await file.slice(0, 12).arrayBuffer());
    const png = [137, 80, 78, 71, 13, 10, 26, 10].every((byte, index) => header[index] === byte);
    const jpeg = header[0] === 255 && header[1] === 216 && header[2] === 255;
    const webp = String.fromCharCode(...header.subarray(0, 4)) === 'RIFF'
      && String.fromCharCode(...header.subarray(8, 12)) === 'WEBP';
    return png || jpeg || webp;
  }

  ui.choose.addEventListener('click', () => ui.files.click());
  ui.files.addEventListener('change', () => {
    const files = Array.from(ui.files.files);
    ui.files.value = '';
    addPhotos(files);
  });

  window.addEventListener('dragover', event => {
    if (!event.dataTransfer.types.includes('Files')) return;
    event.preventDefault();
    const overZone = !busy && ui.choose.contains(event.target);
    event.dataTransfer.dropEffect = overZone ? 'copy' : 'none';
    ui.choose.classList.toggle('dragging', overZone);
  });
  ui.choose.addEventListener('dragleave', () => ui.choose.classList.remove('dragging'));
  window.addEventListener('drop', event => {
    if (!event.dataTransfer.types.includes('Files')) return;
    event.preventDefault();
    ui.choose.classList.remove('dragging');
    if (ui.choose.contains(event.target)) addPhotos(Array.from(event.dataTransfer.files));
  });

  async function addPhotos(files) {
    if (!files.length || busy) return;
    busy = true;
    updateControls();
    ui['import-errors'].replaceChildren();
    clearResults();
    try {
      for (const file of files) {
        if (photos.length >= maxFiles) {
          report(ui['import-errors'], file.name, '최대 20장까지 추가할 수 있습니다.');
          continue;
        }
        if (file.size > maxBytes) {
          report(ui['import-errors'], file.name, '파일 크기가 20MB를 넘습니다.');
          continue;
        }
        let image;
        let thumbnail;
        try {
          if (!await supportedFormat(file)) {
            report(ui['import-errors'], file.name, 'JPG, PNG, WebP 사진만 열 수 있습니다.');
            continue;
          }
          image = await decode(file);
          const canvas = makeCanvas(image, null, null, 640);
          thumbnail = await createImageBitmap(canvas);
          const preview = canvas.toDataURL('image/jpeg', .92);
          photos.push({ file, bitmap: thumbnail, preview });
          thumbnail = null;
        } catch {
          report(ui['import-errors'], file.name, '사진 파일을 열 수 없습니다.');
        } finally {
          image?.close();
          thumbnail?.close();
        }
      }
      selected ||= photos[0] || null;
    } finally {
      busy = false;
      showPhotos();
      showPreview();
    }
  }

  // ZIP 저장 형식은 JPG 데이터를 그대로 묶으며 파일명은 UTF-8로 기록합니다.
  const crcTable = Uint32Array.from({ length: 256 }, (_, byte) => {
    let crc = byte;
    for (let bit = 0; bit < 8; bit++) crc = (crc >>> 1) ^ (crc & 1 ? 0xedb88320 : 0);
    return crc;
  });

  async function zipPhotos(entries) {
    const localParts = [];
    const directory = [];
    const encoder = new TextEncoder();
    const utf8 = 0x0800;
    const dosDate = 33; // 1980-01-01
    let offset = 0;
    let directorySize = 0;
    for (const { name, blob } of entries) {
      const filename = encoder.encode(name);
      const bytes = new Uint8Array(await blob.arrayBuffer());
      let checksum = 0xffffffff;
      for (const byte of bytes) checksum = (checksum >>> 8) ^ crcTable[(checksum ^ byte) & 255];
      checksum ^= 0xffffffff;
      const local = new DataView(new ArrayBuffer(30));
      local.setUint32(0, 0x04034b50, true);
      local.setUint16(4, 20, true);
      local.setUint16(6, utf8, true);
      local.setUint16(12, dosDate, true);
      local.setUint32(14, checksum, true);
      local.setUint32(18, blob.size, true);
      local.setUint32(22, blob.size, true);
      local.setUint16(26, filename.length, true);
      const central = new DataView(new ArrayBuffer(46));
      central.setUint32(0, 0x02014b50, true);
      central.setUint16(4, 20, true);
      central.setUint16(6, 20, true);
      central.setUint16(8, utf8, true);
      central.setUint16(14, dosDate, true);
      central.setUint32(16, checksum, true);
      central.setUint32(20, blob.size, true);
      central.setUint32(24, blob.size, true);
      central.setUint16(28, filename.length, true);
      central.setUint32(42, offset, true);
      localParts.push(local.buffer, filename, blob);
      directory.push(central.buffer, filename);
      offset += local.byteLength + filename.length + blob.size;
      directorySize += central.byteLength + filename.length;
      if (offset + directorySize > 0xffffffff) throw new Error('ZIP 크기 제한을 넘었습니다.');
    }
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true);
    end.setUint16(8, entries.length, true);
    end.setUint16(10, entries.length, true);
    end.setUint32(12, directorySize, true);
    end.setUint32(16, offset, true);
    return new Blob([...localParts, ...directory, end.buffer], { type: 'application/zip' });
  }

  function showDownload(link, blob) {
    const url = URL.createObjectURL(blob);
    downloadUrls.push(url);
    link.href = url;
    link.hidden = false;
  }

  function previewFigure(title, source) {
    const figure = document.createElement('figure');
    const caption = document.createElement('figcaption');
    caption.textContent = title;
    const frame = document.createElement('div');
    frame.className = 'frame';
    const image = new Image();
    image.alt = title + ' 사진';
    image.loading = 'lazy';
    image.src = source;
    frame.append(image);
    figure.append(caption, frame);
    return figure;
  }

  function showProgress(processed, total) {
    const percent = Math.floor(processed / total * 100);
    ui.progress.value = percent;
    ui.status.textContent = percent + '% · ' + processed + ' / ' + total + '장 처리';
  }

  ui.convert.addEventListener('click', async () => {
    if (busy || !photos.length) return;
    busy = true;
    updateControls();
    clearResults();
    const entries = [];
    const total = photos.length;
    ui['progress-box'].hidden = false;
    showProgress(0, total);
    try {
      for (const [index, photo] of photos.entries()) {
        let image;
        try {
          image = await decode(photo.file);
          const canvas = makeCanvas(image, selectedStyle, selectedBackground);
          const preview = makeCanvas(canvas, null, null, 400).toDataURL('image/jpeg', .88);
          const blob = await encode(canvas);
          const basename = photo.file.name.replace(/\.[^.]+$/, '').replace(/[/\\:*?"<>|]/g, '_');
          const name = (index + 1) + '_' + basename + '_변환.jpg';
          entries.push({ name, blob, preview, original: photo.preview });
        } catch {
          report(ui['conversion-errors'], photo.file.name, '사진을 변환할 수 없습니다.');
        } finally {
          image?.close();
          showProgress(index + 1, total);
        }
      }
      ui.status.textContent = '100% · ' + total + '장 중 ' + entries.length + '장 변환 완료';
      if (!entries.length) return;
      for (const { name, blob, original, preview } of entries) {
        const item = document.createElement('li');
        const label = document.createElement('span');
        label.className = 'filename result-name';
        label.textContent = name;
        const comparison = document.createElement('div');
        comparison.className = 'comparison';
        comparison.append(previewFigure('원본', original), previewFigure('변환 결과', preview));
        const link = document.createElement('a');
        link.className = 'button';
        link.download = name;
        link.textContent = 'JPG 저장';
        link.setAttribute('aria-label', name + ' 저장');
        showDownload(link, blob);
        item.append(label, comparison, link);
        ui.downloads.append(item);
      }
      ui.zip.hidden = true;
      ui.results.hidden = false;
      try {
        showDownload(ui.zip, await zipPhotos(entries));
      } catch {
        report(ui['conversion-errors'], 'ZIP', '압축 파일을 만들 수 없습니다. 사진을 개별 저장해 주세요.');
      }
    } finally {
      busy = false;
      updateControls();
    }
  });

  showPreview();
</script>
</body>
</html>
